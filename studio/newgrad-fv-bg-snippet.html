<!--
  URUMO Recruit / 新卒採用FV背景：横幅の広い画面で下側が見切れないようにする（PC）
  貼り付け先：Studio > サイト設定 > カスタムコード > <head>内の末尾

  Studio側の前提（設定済み）
    - students_pc > statement_bg > 背景画像（image）に ID「newgrad-fv-bg」
    - 背景画像は 2880×2720（1440×1360 の2倍）、ボックスは 幅100%・高さ1360px・カバー

  なぜ必要か
    画面幅が1440pxより広いと、カバー表示の画像が横幅に合わせて拡大され、
    高さ1360pxのボックスから上下がはみ出して切り取られる。
    その結果、画像の下側のフェード（グラデーションが消えていく部分）が切れて、
    「求める人物像」の上あたりで背景が途中でスパッと終わって見えていた。

  動き
    - 1441px以上のときだけ、画像を「横100%・縦100%」で表示する（縦は1360pxのまま）
    - ぼかしたグラデーションなので、横に少し引き伸ばされても見た目はほぼ変わらない
    - 1440px以下とSPは、これまでどおり（変更なし）
-->
<style>
  @media (min-width: 1441px) {
    #newgrad-fv-bg > .image__bg-container::before {
      background-size: 100% 100% !important;
    }
  }
</style>
